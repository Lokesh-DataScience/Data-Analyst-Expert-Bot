services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: databot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./vectorstore_data:/app/vectorstore_data
      - ./vector_db:/app/vector_db
    networks:
      - databot_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: databot_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - databot_network

networks:
  databot_network:
    driver: bridge